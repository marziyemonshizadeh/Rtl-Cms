<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="پنل مدیریت فروشگاه؛ محصولات، سفارش‌ها، کاربران و دیدگاه‌ها در یک فضای کاری."
    />
    <title>مدیریت فروشگاه | RTL CMS</title>
    <script>
      // Apply saved appearance before the stylesheet paints the page.
      document.documentElement.dataset.theme = "lime";
      try {
        const theme = localStorage.getItem("theme");
        if (["lime", "orange", "cherry", "blue"].includes(theme)) {
          document.documentElement.dataset.theme = theme;
        }
        document.documentElement.classList.toggle(
          "dark",
          localStorage.getItem("IsDarkMood") === "true",
        );
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
